<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="Script AdminTeacherStudentMaintenance.css">

    <style>
        .logo {
            display: block;
            margin: 0 auto 10px auto;
            width: 80px;
            height: auto;
        }
        
        .button-container {
            box-sizing: border-box;
            width: 300px;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 12px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin: 0 auto;
        }
        
        .button-container .btn {
            display: block;
            padding: 12px;
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 6px;
            font-weight: 500;
            transition: background-color 0.3s ease;
        }
        
        .button-container .btn:hover {
            background-color: #191c1f;
        }
        
        .box {
            position: relative;
            min-height: 140px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        
        .box::before {
            content: "";
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            height: 100%;
            background-color: rgba(255, 255, 255, 0.08);
            animation: box 1s forwards;
            z-index: -1;
        }
        
        h1 {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            color: #ffffff;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
            position: relative;
            animation: forwards move 1s;
            transition: transform 0.3s ease;
            transform: translateY(-5px);
        }
        
        @keyframes box {
            from {
                width: 0;
            }
            to {
                width: 300px;
            }
        }
        
        @keyframes move {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
    </style>
    <style>
        body {
            background-color: #0a0a0a;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
            color: #ffffff;
        }
        
        button {
            background-color: #ffffff;
            color: #0a0a0a;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
            border: 1px solid #ffffff;
            border-radius: 5px;
            font-weight: 600;
            transition: 0.3s;
        }
        
        button:hover {
            background-color: #0a0a0a;
            color: #ffffff;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Smart Classroom</title>
</head>

<body>
    <div id="main-container">
        <div class="box">
            <img src="logo.png" class="logo" alt="Logo">
            <h1>Welcome</h1>
        </div><br>
        <br>
        <div class="button-container">
            <button onclick="goToAdmin()">As an Admin</button>
            <button onclick="goToTeacher()">As a Teacher</button>
            <button onclick="goToStudent()">As a Student</button>
            <button onclick="goToMaintenance()">As Maintenance Staff</button>
        </div><br>
    </div>

    <script>
        function navigateTo(page) {
            window.location.href = page;
        }

        function goToAdmin() {
            navigateTo("AdminPanel.html");
        }

        function goToTeacher() {
            navigateTo("TeacherPanel.html");
        }

        function goToStudent() {
            navigateTo("StudentPanel.html");
        }

        function goToMaintenance() {
            navigateTo("MaintenancePanel.html");
        }
    </script>
</body>

</html>
