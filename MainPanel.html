<!DOCTYPE html>
<html lang="en">

<head>
    <link rel="stylesheet" href="Script AdminTeacherStudentMaintenance.css">

    <style>
        .logo {
            position: fixed;
            top: 00px;
            right: 90px;
            width: 80px;
        }
        
        .button-container {
            box-sizing: border-box;
            width: 300px;
            padding: 20px;
            background-color: #605757;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        
        .button-container .btn {
            display: block;
            padding: 12px;
            color: white;
            text-decoration: none;
            text-align: center;
            border-radius: 6px;
            font-weight: 500;
            transition: background-color 0.3s ease;
        }
        
        .button-container .btn:hover {
            background-color: #191c1f;
        }
        
        .box {
            position: relative;
            height: 60px;
        }
        
        .box::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            height: 140%;
            background-color: white;
            animation: box 1s forwards;
        }
        
        h1 {
            font-family: 'Poppins', sans-serif;
            margin: 0;
            top: 0;
            font-size: 2 rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            background: linear-gradient(45deg, #352b2b, #366562);
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: #ffffff;
            position: relative;
            animation: forwards move 1s;
            transition: transform 0.3s ease;
            transform: translateY(-5px);
        }
        
        @keyframes box {
            from {
                width: 0;
            }
            to {
                width: 70%;
            }
        }
        
        @keyframes move {
            from {
                left: 0px;
            }
            to {
                left: 90px;
            }
        }
    </style>
    <style>
        body {
            background-color: #605757;
            font-family: Arial, sans-serif;
            text-align: center;
            padding-top: 50px;
        }
        
        button {
            background-color: #a29e9c;
            color: rgb(53, 58, 75);
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            margin: 10px;
            cursor: pointer;
            border: none;
            border-radius: 5px;
        }
        
        button:hover {
            background-color: #6a6865;
        }
    </style>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to Smart Classroom</title>
</head>

<body>
    <div id="main-container">
        <div class="box">
            <h1> <img src="logo.png" class="logo" alt="Logo" style="width: 100px; height: 100px;"><br>Welcome</h1>
        </div><br>
        <br>
        <div class="button-container"><button onclick="goToAdmin()">As an Admin</button>
            <button onclick="goToTeacher()">As a Teacher</button>
            <button onclick="goToStudent()">As a Student</button>
            <button onclick="goToMaintenance()">As Maintenance Staff</button>
        </div><br>
    </div>

    <script>
        function navigateTo(page) {
            window.location.href = page;
        }

        function goToAdmin() {
            navigateTo("AdminPanel.html");
        }

        function goToTeacher() {
            navigateTo("TeacherPanel.html");
        }

        function goToStudent() {
            navigateTo("StudentPanel.html");
        }

        function goToMaintenance() {
            navigateTo("MaintenancePanel.html");
        }
    </script>
</body>

</html>
